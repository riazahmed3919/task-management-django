{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body>
    <h1>Welcome to Authentication System</h1>
    <div>
        {% if messages %}
            {% for message in messages %}
                <div class="p-2 {% if message.tags == 'success' %} bg-green-500 {% endif %}"> {{message}} </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{form}}
            <button type="submit" class="bg-rose-500 px-2 py-1 rounded-lg"> Sign in </button>
        </form>
    </div>
</body>
</html>
